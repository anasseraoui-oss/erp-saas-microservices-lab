spring.application.name=Purchase-Order-Service
server.port=8033
spring.profiles.include=purchases,security,eureka

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/purchaseorder-Service-db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
# --- Security Configuration ---
security.jwt.secret-key=${JWT_SECRET_KEY:REDACTED_JWT_SECRET}
# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
spring.cloud.discovery.enabled=${SPRING_CLOUD_DISCOVERY_ENABLED:true}
spring.config.import=optional:file:/app/env/purchases.env,optional:file:/app/env/security.env,optional:file:/app/env/eureka.env,${SPRING_CONFIG_IMPORT:optional:configserver:}
spring.cloud.compatibility-verifier.enabled=false
eureka.instance.prefer-ip-address=true
