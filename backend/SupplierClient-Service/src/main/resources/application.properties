spring.application.name=SupplierClient-Service
server.port=8034
spring.profiles.include=supplierClient,eureka,security
# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supplierClient-service-db}?updateDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

# Eureka Client Configuration
eureka.client.service-url.default-zone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
spring.cloud.discovery.enabled=${SPRING_CLOUD_DISCOVERY_ENABLED:true}
# Force Eureka client to register with its IP address instead of its hostname
eureka.instance.prefer-ip-address=true
# Configuration Import
spring.config.import=optional:file:/app/env/supplierClient.env,optional:file:/app/env/eureka.env,optional:file:/app/env/security.env,${SPRING_CONFIG_IMPORT:optional:configserver:}

# Compatibility Verifier (disabled)
spring.cloud.compatibility-verifier.enabled=false

# --- Security Configuration ---
security.jwt.secret-key=${JWT_SECRET_KEY:REDACTED_JWT_SECRET}


