spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:3003
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: security-service
          uri: lb://security-service
          predicates:
            - Path=/users/**,/auth/**,/api/permissions/**,/admin/**,/api/activities/**,/ws/online/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/expired-products/**
        - id: sales-order-service
          uri: lb://sales-order-service
          predicates:
            - Path=/sales/**,/line/sales/**,/lineReturn/sales/**
        - id: purchase-order-service
          uri: lb://purchase-order-service
          predicates:
            - Path=/purchases/**,/line/purchases/**,/lineReturn/purchases/**
        - id: supplier-client-service
          uri: lb://supplier-client-service
          predicates:
            - Path=/SupplierClients/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**,/api/dataPaidDates/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**,/api/sand/**,/test/**,/ws/notifications/**

server:
  port: ${SERVER_PORT:9055}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
