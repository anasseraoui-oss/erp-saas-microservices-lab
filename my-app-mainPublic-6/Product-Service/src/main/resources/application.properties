# ===================================================================
# =              PRODUCT SERVICE CONFIGURATION                      =
# ===================================================================

# --- Application Settings ---
spring.application.name=Product-Service
server.port=8031

# --- Database Configuration ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product-Service-db}?updateDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

# --- Profiles Configuration ---
spring.profiles.include=product,eureka,security
spring.config.import=optional:file:/app/env/product.env,optional:file:/app/env/eureka.env,optional:file:/app/env/security.env,${SPRING_CONFIG_IMPORT:optional:configserver:}

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true

# --- Kafka Producer Configuration ---
# Bootstrap servers
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:broker:29092}

# Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer properties for reliability and performance
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.batch.size=16384
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.buffer.memory=33554432

# Important: Disable type headers to avoid ClassNotFoundException
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Security Configuration ---
security.jwt.secret-key=${JWT_SECRET_KEY:REDACTED_JWT_SECRET}
security.enabled=false

# --- Logging Configuration (optionnel) ---
logging.level.com.spring.productservice=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO