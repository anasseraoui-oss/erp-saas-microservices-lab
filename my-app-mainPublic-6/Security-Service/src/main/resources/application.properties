spring.application.name=Security-Service
server.port=8081
spring.profiles.include=security,eureka

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/security-service-db}?updateDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true


# 1h in millisecond
security.jwt.expiration-time=86400000
security.jwt.secret-key=REDACTED_JWT_SECRET


# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${SPRING_CLOUD_DISCOVERY_ENABLED:true}
# Force Eureka client to register with its IP address instead of its hostname
eureka.instance.prefer-ip-address=true
# Import environment configuration
spring.config.import=optional:file:/app/env/security.env,optional:file:/app/env/eureka.env,${SPRING_CONFIG_IMPORT:optional:configserver:}

# Compatibility Verifier (disabled)
spring.cloud.compatibility-verifier.enabled=false