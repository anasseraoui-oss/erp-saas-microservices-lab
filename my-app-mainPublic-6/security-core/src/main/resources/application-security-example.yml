# Example configuration for security-core library
# Copy this to your microservice's application.yml and customize as needed

security:
  jwt:
    enabled: true
    # Use environment variable for production
    secret-key: "REDACTED_JWT_SECRET"
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds
    issuer: "ecommerce-microservices"
    audience: "ecommerce-users"
    header-name: "Authorization"
    token-prefix: "Bearer "
  enabled: false
  # Public endpoints that don't require authentication
  public-endpoints:
    - "/actuator/**"
    - "/health/**"
    - "/swagger-ui/**"
    - "/v3/api-docs/**"
    - "/error"
    - "/api/auth/**"
    - "/api/products/**"
    - "/SupplierClients/**"
    - "/api/expired-products/**"
    - "/payment/**"
    - "/api/dataPaidDates/**"
    - "/purchases/**"
    - "/line/purchases/**"
    - "/lineReturn/purchases/**"
    - "/sales/**"
    - "/line/sales/**"
    - "/lineReturn/sales/**"
    - "/api/notifications/**" # <-- ADD THIS LINE
    - "/test/**"               # <-- AND THIS LINE
  
  # CORS configuration

# Logging configuration for security debugging
logging:
  level:
    com.ecommerce.security.core: INFO
    org.springframework.security: INFO
    org.springframework.web.filter.OncePerRequestFilter: DEBUG 