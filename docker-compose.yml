networks:
  ecom-net:
    driver: bridge

services:
  # Eureka Server
  eureka-server:
    build:
      context: ./Eureka-Server
    ports:
      - "8761:8761"
    expose:
      - "8761"
    container_name: eureka-server
    restart: always
    networks:
      - ecom-net
      #test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]

  # Gateway Service
  gateway-service:
    image: gateway-service
    build:
      context: ./Gateway-Service
    ports:
      - "9055:9055"
    restart: always
    environment:
      - eureka.instance.preferIpAddress=true
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
    depends_on:
       - eureka-server
    volumes:
      - ../env:/app/env
    networks:
      - ecom-net  #ecom-net
    #healthcheck:
     # test: [ "CMD", "curl", "-f", "http://localhost:9055/actuator/health" ]
      #interval: 30s
      #timeout: 10s
      #retries: 3
  #////////////// product service /////////////////////


  product-service:
    image: product-service
    build:
      context: ./Product-Service
    ports:
      - "8031:8031"
    restart: always
    environment:
      - eureka.instance.preferIpAddress=true
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
    env_file:
      - ./env/product.env
    volumes:
      - ./env:/app/env
    depends_on:
      product-Service-db:
        condition: service_healthy
      gateway-service:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - ecom-net

  product-Service-db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: product-Service-db
    ports:
      - "3329:3306"
    volumes:
      - product-service-db-data:/var/lib/mysql
      #- ./Product-Service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecom-net
    healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
       interval: 30s
       retries: 3
       start_period: 30s
       timeout: 10s
  #--------------------------------------security-config--------------------------------------

  security-service:
    image: security-service
    build:
      context: ./Security-Service
      #dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: always
    environment:
      - eureka.instance.preferIpAddress=true
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
    env_file:
      - ./env/security.env
    volumes:
      - ../env:/app/env
    depends_on:
      security-service-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecom-net

  security-service-db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: security-service-db
    ports:
      - "3307:3306"
    volumes:
      - security-service-db-data:/var/lib/mysql
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 10s

    #--------------------------------------sales-order-config--------------------------------------

  salesorder-service:
      image: salesorder-service
      build:
        context: ./Sales-Order-Service
      restart: always
      ports:
        - "8032:8032"
      environment:
        - eureka.instance.preferIpAddress=true
        - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      env_file:
        - env/sales.env
      volumes:
        - ../env:/app/env
      depends_on:
        salesorder-service-db:
          condition: service_healthy
        eureka-server:
          condition: service_started
      networks:
        - ecom-net

  salesorder-service-db:
      image: mysql:latest
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: change-me
        MYSQL_DATABASE: salesorder-service-db
      ports:
        - "3313:3306"
      volumes:
        - salesorder-service-db-data:/var/lib/mysql
      networks:
        - ecom-net
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 30s
        retries: 3
        start_period: 5s
        timeout: 10s

    #--------------------------------------purchase-order-config--------------------------------------

  purchaseorder-service:
      image: purchaseorder-service
      build:
        context: ./Purchase-Order-Service
      ports:
        - "8033:8033"
      restart: always
      env_file:
        - env/purchases.env
      environment:
        - eureka.instance.preferIpAddress=true
        - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      volumes:
        - ../env:/app/env
      depends_on:
        purchaseorder-Service-db:
          condition: service_healthy
        eureka-server:
          condition: service_started
      networks:
        - ecom-net

  purchaseorder-Service-db:
      image: mysql:latest
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: change-me
        MYSQL_DATABASE: purchaseorder-Service-db
      ports:
        - "3312:3306"
      volumes:
        - purchaseorder-service-db-data:/var/lib/mysql
      networks:
        - ecom-net
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 30s
        retries: 3
        start_period: 5s
        timeout: 10s

    #--------------------------------------supplier-client-config--------------------------------------

  supplierClient-service:
      image: supplierclient-service
      build:
        context: ./SupplierClient-Service
      ports:
        - "8034:8034"
      restart: always
      env_file:
        - env/supplierClient.env
      environment:
        - eureka.instance.preferIpAddress=true
        - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      volumes:
        - ../env:/app/env
      depends_on:
        supplierClient-service-db:
          condition: service_healthy
        eureka-server:
          condition: service_started
      networks:
        - ecom-net

  supplierClient-service-db:
      image: mysql:latest
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: change-me
        MYSQL_DATABASE: supplierClient-service-db
        MYSQL_ROOT_HOST: '%'
      ports:
        - "3324:3306"
      volumes:
        - supplierClient-service-db-data:/var/lib/mysql
      networks:
        - ecom-net
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 30s
        retries: 3
        start_period: 5s
        timeout: 10s
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    # 2. تشغيل Kafka Broker (الخادم)
  broker:
      image: confluentinc/cp-kafka:7.3.0
      hostname: broker
      container_name: broker
      # يعتمد على ZooKeeper، مما يضمن أن ZooKeeper سيبدأ أولاً
      depends_on:
        - zookeeper
      ports:
        # هذا هو المنفذ الذي سيتصل به تطبيقك
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181' # يخبر Kafka بمكان ZooKeeper
        # هذا الإعداد مهم جدًا لكي يتمكن تطبيقك من الاتصال من خارج Docker
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  product-service-db-data:
  security-service-db-data:
  salesorder-service-db-data:
  purchaseorder-service-db-data:
  supplierClient-service-db-data:

