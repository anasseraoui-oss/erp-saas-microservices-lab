spring:
  application:
    name: Gateway-Service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        websocket:
          max-frame-payload-length: 1048576
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedOrigins:
              - "http://host.docker.internal:3003"
              - "http://localhost:3003"
              - "ws://localhost:3003"
              - "http://127.0.0.1:3003"
              - "http://localhost:3000"
              - "ws://localhost:3000"
              - "http://localhost:9000"
              - "ws://localhost:9000"
              - "http://localhost:9055"
              - "ws://localhost:9055"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # WebSocket route for Security-Service - MUST be FIRST and MOST SPECIFIC
        - id: security-service-websocket-route
          uri: lb://Security-Service
          predicates:
            - Path=/ws/online/**
          filters:
            - RewritePath=/ws/online/(?<segment>.*), /ws/online/$\{segment}

        # Security Service (for user authentication, etc.)
        - id: Security-Service-route
          uri: lb://Security-Service
          predicates:
            - Path=/users/**, /auth/**, /api/permissions/**, /admin/**, /api/activities/**

        # Product Service
        - id: product-service-route
          uri: lb://Product-Service
          predicates:
            - Path=/api/products/**, /api/expired-products/**

        # Sales Order Service (Combined Routes)
        - id: sales-order-service-route
          uri: lb://sales-order-service
          predicates:
            - Path=/sales/**, /line/sales/**, /lineReturn/sales/**

        # Purchase Order Service (Combined Routes)
        - id: purchase-order-service-route
          uri: lb://purchase-order-service
          predicates:
            - Path=/purchases/**, /line/purchases/**, /lineReturn/purchases/**

        # Supplier/Client Service
        - id: SupplierClient-Service-route
          uri: lb://SupplierClient-Service
          predicates:
            - Path=/SupplierClients/**

        # FIXED: WebSocket route for SockJS endpoint - MUST come before HTTP route
        - id: notification-service-websocket-route
          uri: lb://notification-service
          predicates:
            - Path=/ws/notifications/**, /ws/notifications/info, /ws/notifications/websocket
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=Access-Control-Allow-Origin, http://localhost:3003
            - AddResponseHeader=Access-Control-Allow-Credentials, true
          # No RewritePath filter - pass through as is

        # HTTP route for notification service API
        - id: notification-service-http-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /test/**, /api/sand/**, /test/**

        - id: Payment-Service-route
          uri: lb://Payment-Service
          predicates:
            - Path=/payment/**, /api/dataPaidDates/**

server:
  port: 9055
# Eureka client configuration
eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# Additional configuration for WebSocket support
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG