spring.application.name=Sales-Order-Service
server.port=8032
spring.profiles.include=sales,eureka,security

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/salesorder-Service-db}?updateDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
# --- Security Configuration ---
security.jwt.secret-key=${JWT_SECRET_KEY:REDACTED_JWT_SECRET}
# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
spring.cloud.discovery.enabled=${SPRING_CLOUD_DISCOVERY_ENABLED:true}
spring.config.import=optional:file:/app/env/sales.env,optional:file:/app/env/eureka.env,${SPRING_CONFIG_IMPORT:optional:configserver:}
# Force Eureka client to register with its IP address instead of its hostname
eureka.instance.prefer-ip-address=true
# Spring Cloud
spring.cloud.compatibility-verifier.enabled=false
